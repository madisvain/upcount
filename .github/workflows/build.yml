name: "publish"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-24.04"
            args: ""

    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: install dependencies (ubuntu only)
        if: matrix.settings.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.1 is for Tauri v2.

      # Tauri's pinned 2024 linuxdeploy has an excludelist predating libwayland-client.so.0,
      # so it bundles the runner's copy and breaks EGL on Mesa 25+ (#180, tauri-apps/tauri#15665).
      # Tauri only downloads tools it cannot find, so seeding the cache overrides it.
      - name: use newer linuxdeploy for AppImage bundling (ubuntu only)
        if: matrix.settings.platform == 'ubuntu-24.04'
        env:
          LINUXDEPLOY_RELEASE: "1-alpha-20251107-1"
          LINUXDEPLOY_SHA256: "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
        run: |
          set -euo pipefail
          appimage="$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"
          mkdir -p "$(dirname "$appimage")"
          curl -fsSL --retry 3 -o "$appimage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_RELEASE/linuxdeploy-x86_64.AppImage"
          echo "$LINUXDEPLOY_SHA256  $appimage" | sha256sum -c -
          chmod +x "$appimage"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Save API key to file
        if: matrix.settings.platform == 'macos-latest'
        env:
          APPLE_API_KEY_VALUE: ${{ secrets.APPLE_API_KEY_VALUE }}
        shell: bash
        run: echo "$APPLE_API_KEY_VALUE" >> ${{ github.workspace }}/apple-api-key.p8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Apple signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_VALUE: ${{ secrets.APPLE_API_KEY_VALUE }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/apple-api-key.p8
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # Build configuration
          NODE_OPTIONS: "--max-old-space-size=4096"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: "See the assets to download a version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.settings.args }}
